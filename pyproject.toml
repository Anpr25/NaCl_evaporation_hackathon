[project]
name = "specalive"
version = "0.1.0"
description = "From heterogeneous engineering evidence to SysML v2 and executable Modelica, agentically."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # ingest
    "pypdf>=4.2",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pillow>=10.3",
    # web
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # report
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
specalive = "specalive.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: requires OpenModelica; ~40s. Run with `pytest -m slow`."]
addopts = "-m 'not slow' -q"
