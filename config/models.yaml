# SpecAlive model routing.
#
# Rule: always attempt the cheapest tier that can do the job, validate the output against a
# schema, and only escalate on validation failure. Never silently accept an unvalidated answer.
#
# Owner: D (platform). Consumed by src/specalive/llm/router.py.

tiers:
  # ---------------------------------------------------------------- T0
  t0_deterministic:
    kind: deterministic
    description: >
      No model at all. Parsers, regex, table readers, graph algorithms. Anything that can be
      done here MUST be done here: it is free, exact, offline and reproducible.

  # ---------------------------------------------------------------- T1
  t1_local_small:
    kind: ollama
    # Chosen by measurement, not reputation: run `specalive models` and use the winner.
    # ~2.6 GB quantised, so it fits entirely on a 4 GB card with room for an 8K KV cache.
    # Fitting fully in VRAM matters more than parameter count here -- a 7B that spills to
    # CPU runs ~4x slower, and our workload is hundreds of short batched extractions.
    model: qwen3:4b
    fallback_models: [qwen2.5:3b-instruct-q4_K_M, llama3.2:3b]
    base_url: http://localhost:11434
    context: 4096
    # MEASURED on a Quadro T1000 (4 GB, display on the iGPU):
    #   default          -> 67% GPU, 13.3 tok/s   (Ollama leaves ~1.6 GB unused)
    #   num_gpu: 99      -> 100% GPU, 43.1 tok/s, 3.18 GB resident
    # Forcing every layer onto the card is a 3.2x speedup and still fits. Lower this if a
    # teammate's card is smaller; `specalive models` will show the split.
    options: {num_gpu: 99}
    # qwen3 is a reasoning model: with thinking on, `response` comes back EMPTY and the whole
    # answer lands in a separate `thinking` field, so every structured call fails and the
    # router escalates for nothing. We want no reasoning here anyway.
    think: false
    structured_output: json_schema
    max_tokens: 2048
    timeout_s: 120
    good_at: [span_to_claim, catalog_shortlist_pick, field_normalisation, report_prose]

  t1_local_embed:
    kind: ollama_embed
    model: nomic-embed-text
    base_url: http://localhost:11434
    dim: 768
    good_at: [catalog_retrieval, claim_dedupe]

  # ---------------------------------------------------------------- T2
  t2_local_mid:
    kind: ollama
    model: qwen2.5:7b-instruct-q4_K_M
    base_url: http://localhost:11434
    context: 16384
    # ~4.7 GB: needs partial CPU offload on 4 GB VRAM. Set num_gpu to taste.
    options: {num_gpu: 22}
    structured_output: json_schema
    max_tokens: 4096
    timeout_s: 300
    good_at: [prose_extraction, guard_normalisation]

  # ---------------------------------------------------------------- T3
  t3_cloud_reasoning:
    kind: groq
    # Verified against the live /models endpoint on 2026-09-24. Hosted catalogues churn --
    # llama-3.3-70b-versatile was configured here and 404s on a current key -- so the tier
    # carries fallbacks and the provider walks the list on a model-not-found.
    model: openai/gpt-oss-120b
    fallback_models: [qwen/qwen3.8-27b, openai/gpt-oss-20b]
    api_key_env: GROQ_API_KEY
    structured_output: json_object
    max_tokens: 8192
    timeout_s: 120
    good_at: [conflict_adjudication, equation_synthesis, repair_diff, topology_inference]
    quota: {rpm: 30, tpm: 8000, rpd: 1000}   # measured from Groq x-ratelimit headers, not guessed

  # ---------------------------------------------------------------- T4
  t4_cloud_vision:
    kind: gemini
    # `-latest` tracks the current flash model so a rename cannot break the demo;
    # reproducibility comes from the response cache, not from a pinned model id.
    model: gemini-flash-latest
    fallback_models: [gemini-3.8-flash, gemini-3.5-flash]
    api_key_env: GEMINI_API_KEY
    structured_output: response_schema
    max_tokens: 8192
    timeout_s: 180
    good_at: [diagram_reading, scanned_page_ocr, long_context_crossdoc, repair_diff]
    quota: {rpm: 10, rpd: 250}

  # ------------------------------------------------------- T4 extraction (Gemini, text)
  # The same backend as the vision tier but its own entry, because it does a different job
  # under a different budget. Extraction is the stage where being wrong is most expensive:
  # everything downstream is deterministic codegen, so a component the extractor never saw
  # is a component that cannot appear in the Modelica no matter how good the emitter is.
  # A local 3B is adequate at turning one sentence into one claim and poor at reading a
  # control-sequence table out of a design note; the cloud flash model is good at both and
  # free at this volume.
  t4_cloud_extract:
    kind: gemini
    model: gemini-flash-latest
    fallback_models: [gemini-3.8-flash, gemini-3.7-flash, gemini-3.5-flash, gemini-3.1-flash-lite]
    api_key_env: GEMINI_API_KEY
    structured_output: response_schema
    max_tokens: 8192
    timeout_s: 180
    good_at: [prose_extraction, span_to_claim, guard_normalisation, catalog_shortlist_pick]
    quota: {rpm: 12, rpd: 400}

  # ------------------------------------------------- T5 whole-packet reasoning (Gemini Pro)
  # Reserved for the two jobs that need the WHOLE packet in one context rather than a chunk
  # of it: reading a system skeleton off fifteen documents at once, and repairing a model
  # whose fault is a relationship between a declaration and a connect two hundred lines
  # apart. Both are few-calls-per-run, so the stronger model is affordable here and nowhere
  # else.
  t5_cloud_deep:
    kind: gemini
    model: gemini-pro-latest
    fallback_models: [gemini-3.1-pro-preview, gemini-flash-latest, gemini-3.8-flash]
    api_key_env: GEMINI_API_KEY
    structured_output: response_schema
    max_tokens: 16384
    timeout_s: 300
    good_at: [system_skeleton, long_context_crossdoc, repair_diff, topology_inference]
    quota: {rpm: 5, rpd: 100}

  # ---------------------------------------------------------------- local vision fallback
  t4_local_vision:
    kind: ollama
    model: qwen2-vl:2b
    base_url: http://localhost:11434
    good_at: [diagram_reading]

  # ---------------------------------------------------------------- OpenRouter
  # A single-key gateway to many hosted models (text and vision), used when neither a local
  # Ollama daemon nor Groq/Gemini keys are available. Pinned to OpenRouter's free (":free",
  # zero prompt/completion pricing) models: fine for a hackathon budget, but "free" means no
  # uptime/rate-limit guarantee -- re-check https://openrouter.ai/collections/free-models
  # before a live run, since the free catalog rotates.
  t3_openrouter:
    kind: openrouter
    model: nvidia/nemotron-3-ultra-550b-a55b:free
    fallback_models: [inclusionai/ling-3.0-flash-fin:free, nvidia/nemotron-3-super-120b-a12b:free]
    api_key_env: OPENROUTER_API_KEY
    structured_output: json_object
    max_tokens: 8192
    timeout_s: 120
    good_at: [conflict_adjudication, equation_synthesis, repair_diff, topology_inference]

  t4_openrouter_vision:
    kind: openrouter
    model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
    fallback_models: [nex-agi/nex-n2.5-mini:free]
    api_key_env: OPENROUTER_API_KEY
    structured_output: json_object
    max_tokens: 8192
    timeout_s: 180
    good_at: [diagram_reading, scanned_page_ocr]

# Task -> ordered escalation chain. First entry is tried first.
routes:
  parse_structured:      [t0_deterministic]
  # Extraction leads with the cloud flash model, not with the local 3B. The tiering rule is
  # "cheapest tier that CAN DO THE JOB", and measurement on four packets says the 3B cannot
  # do this one: what it misses here is not recoverable downstream, because a part no claim
  # mentions is a part the emitter is right to leave out. The local tiers stay in the chain
  # underneath, so `--provider local` and an offline machine still work.
  extract_claim:         [t4_cloud_extract, t1_local_small, t2_local_mid, t3_cloud_reasoning, t3_openrouter]
  extract_prose:         [t4_cloud_extract, t2_local_mid, t3_cloud_reasoning]
  #: Whole-packet structural read. See src/specalive/extract/skeleton.py.
  system_skeleton:       [t5_cloud_deep, t4_cloud_extract, t3_cloud_reasoning]
  read_diagram:          [t4_cloud_vision, t4_openrouter_vision, t4_local_vision]
  catalog_retrieve:      [t0_deterministic, t1_local_embed]
  catalog_pick:          [t4_cloud_extract, t1_local_small, t3_cloud_reasoning]
  #: Restate a part in library vocabulary when retrieval comes back weak. Emitter L0.
  catalog_query:         [t4_cloud_extract, t3_cloud_reasoning, t1_local_small]
  #: Acceptance criterion -> check expression, validated against the real result.
  #: The strongest model first: a loose translation of a criterion is worse than none.
  #: Groq's reasoning model ahead of the Gemini flash tier: when the stronger Gemini models
  #: are busy, that tier walks down to flash-lite, whose translations were loose enough to
  #: check the wrong thing.
  formalise_criterion:   [t5_cloud_deep, t3_cloud_reasoning, t4_cloud_extract]
  adjudicate_conflict:   [t3_cloud_reasoning, t2_local_mid]
  equation_synthesis:    [t3_cloud_reasoning, t4_cloud_vision]
  repair_modelica:       [t0_deterministic, t5_cloud_deep, t3_cloud_reasoning, t4_cloud_vision]
  write_prose:           [t1_local_small, t0_deterministic]

# Provider selection modes, chosen with `specalive --provider`.
modes:
  auto:   {allow: [t0_deterministic, t1_local_small, t1_local_embed, t2_local_mid, t3_cloud_reasoning, t4_cloud_vision, t4_cloud_extract, t5_cloud_deep, t4_local_vision, t3_openrouter, t4_openrouter_vision]}
  local:  {allow: [t0_deterministic, t1_local_small, t1_local_embed, t2_local_mid, t4_local_vision]}
  cloud:  {allow: [t0_deterministic, t3_cloud_reasoning, t4_cloud_vision, t4_cloud_extract, t5_cloud_deep, t3_openrouter, t4_openrouter_vision]}
  # Replay must allow the SAME tiers as auto. `replay_only` is what prevents a live call,
  # and the router checks it *after* the cache lookup. Listing only t0 here left the tier
  # chain empty, so run() raised before ever opening the cache and every model-derived claim
  # silently vanished -- a replay that looked fast because it did nothing.
  replay:
    allow: [t0_deterministic, t1_local_small, t1_local_embed, t2_local_mid,
            t3_cloud_reasoning, t4_cloud_vision, t4_cloud_extract, t5_cloud_deep,
            t4_local_vision, t3_openrouter, t4_openrouter_vision]
    replay_only: true
  none:   {allow: [t0_deterministic]}                      # deterministic-only smoke path

cache:
  enabled: true
  dir: .specalive_cache
  # Cache key = sha256(tier.model + prompt + schema + images). Warm this before demo day
  # and ship it, so `--provider replay` reproduces a known-good run with no network.

limits:
  max_escalations_per_task: 2
  max_retries_same_tier: 1
  repair_iterations: 6
